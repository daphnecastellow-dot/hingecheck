[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hingecheck"
version = "0.1.0"
description = "Track project assumptions, dependencies, and recheck impact."
requires-python = ">=3.10"

[project.scripts]
hingecheck = "hingecheck:main"

[tool.setuptools]
py-modules = ["hingecheck"]
